name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install runtime and quality checks
        run: python -m pip install -r requirements.txt ruff==0.14.0
      - name: Bug-focused static analysis
        run: python -m ruff check app tests scripts --select F,E9,B
      - name: Runtime validation
        run: python scripts/ci-validate.py
      - name: Upload verified source package
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: task-continuity-agent-source
          path: |
            dist/task-continuity-agent-*.zip
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error
          retention-days: 30
